<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サガン式 サッカー解説ボード</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#123}header{padding:14px 18px;background:#00529b;color:white;font-size:22px;font-weight:bold}.wrap{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;max-width:1450px;margin:auto}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 3px 14px #0001}h2{margin:0 0 12px;font-size:20px}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;font-weight:bold;font-size:14px;margin:8px 0 4px}input{width:100%;padding:11px;border:1px solid #ccd8e2;border-radius:10px}button{border:0;border-radius:10px;padding:11px 13px;background:#e8f2fb;color:#00529b;font-weight:bold}button.primary{background:#00529b;color:#fff}button.danger{background:#ffe8e8;color:#b00}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.hint{font-size:13px;color:#678;margin:8px 0}.status{font-weight:bold;color:#00529b;margin:8px 0}#players{max-height:420px;overflow:auto}.p{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #eee}.thumb{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:bold}.p button{margin-left:auto;padding:7px}#pitch{position:relative;width:100%;aspect-ratio:1.55;background:repeating-linear-gradient(0deg,#138b49 0 9%,#108044 9% 18%);border:4px solid white;border-radius:8px;overflow:hidden;touch-action:none}.line{position:absolute;border:2px solid #fffc}.mid{left:50%;top:0;height:100%;border-left:2px solid white}.circle{left:50%;top:50%;width:19%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}.boxL{left:0;top:25%;width:16%;height:50%}.boxR{right:0;top:25%;width:16%;height:50%}.player{position:absolute;width:52px;height:52px;border-radius:50%;background:#00529b;color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;transform:translate(-50%,-50%);z-index:5;touch-action:none;user-select:none}.player img{width:100%;height:100%;object-fit:cover;border-radius:50%}.num{position:absolute;bottom:-13px;background:white;color:#00529b;border-radius:8px;padding:1px 5px;font-size:11px}.ball{position:absolute;z-index:6;font-size:34px;transform:translate(-50%,-50%);touch-action:none;user-select:none}.arrow{position:absolute;height:4px;background:white;transform-origin:left center;z-index:4}.arrow:after{content:"";position:absolute;right:-2px;top:-6px;border-left:13px solid white;border-top:8px solid transparent;border-bottom:8px solid transparent}@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:9px}}
</style></head><body><header>⚽ サガン式 サッカー解説ボード</header>
<div class="wrap"><section class="card"><h2>選手登録（最大50人）</h2><label>顔写真</label><input id="photo" type="file" accept="image/*"><div class="row"><div><label>背番号</label><input id="num" type="number" min="1" max="99" value="1"></div><div><label>名前</label><input id="name" placeholder="選手名"></div></div><div class="row" style="margin-top:10px"><button class="primary" id="reg">選手を登録</button><button id="new">＋新規</button></div><div class="status" id="count">登録選手：0 / 50人</div><div id="players"></div><div class="hint">一覧の「配置」でピッチへ。保存すると選手データも残ります。</div></section>
<section class="card"><div class="tools"><button data-f="4-4-2">4-4-2</button><button data-f="4-3-3">4-3-3</button><button data-f="3-5-2">3-5-2</button><button id="ball">⚽ ボール</button><button id="arrow">↗ パス線</button><button id="clear">クリア</button><button id="save" class="primary">保存</button><button id="load">読み込み</button></div><label>解説メモ</label><input id="memo" placeholder="例：右サイドから中央へ展開"><div class="hint">選手とボールはドラッグ。パス線モードではピッチをドラッグ。</div><div id="pitch"><div class="line mid"></div><div class="line circle"></div><div class="line boxL"></div><div class="line boxR"></div></div></section></div>
<script>
const pitch=document.querySelector('#pitch');let roster=[],arrows=[],arrowMode=false,ball=null,drag=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function photo(f){return new Promise(r=>{if(!f)return r('');let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function render(){ $('count').textContent=`登録選手：${roster.length} / 50人`; $('players').innerHTML=roster.map(p=>`<div class="p">${p.photo?`<img class="thumb" src="${p.photo}">`:`<div class="thumb">${p.num}</div>`}<span>${p.num}　${esc(p.name)}</span><button onclick="place('${p.id}')">配置</button><button class="danger" onclick="del('${p.id}')">削除</button></div>`).join('')}
window.del=id=>{roster=roster.filter(p=>p.id!==id);render()}
window.place=id=>{let p=roster.find(x=>x.id===id);if(!p)return;let e=document.createElement('div');e.className='player';e.dataset.id=id;e.style.left='50%';e.style.top='50%';e.innerHTML=p.photo?`<img src="${p.photo}"><span class="num">${p.num}</span>`:`${p.num}<span class="num">${p.num}</span>`;pitch.appendChild(e);dragify(e)}
function dragify(e){e.onpointerdown=x=>{if(arrowMode)return;drag=e;e.setPointerCapture(x.pointerId)};e.onpointermove=x=>{if(drag!==e)return;let r=pitch.getBoundingClientRect();e.style.left=Math.max(3,Math.min(97,(x.clientX-r.left)/r.width*100))+'%';e.style.top=Math.max(5,Math.min(95,(x.clientY-r.top)/r.height*100))+'%'};e.onpointerup=()=>drag=null}
$('reg').onclick=async()=>{if(roster.length>=50)return alert('選手は最大50人です');if(!$('name').value.trim())return alert('名前を入力してください');roster.push({id:Date.now()+Math.random(),num:$('num').value,name:$('name').value.trim(),photo:await photo($('photo').files[0])});render();$('new').click()}
$('new').onclick=()=>{$('num').value=roster.length+1;$('name').value='';$('photo').value=''}
$('ball').onclick=()=>{if(ball)ball.remove();ball=document.createElement('div');ball.className='ball';ball.textContent='⚽';ball.style.left='50%';ball.style.top='50%';pitch.appendChild(ball);dragify(ball)}
$('clear').onclick=()=>{pitch.querySelectorAll('.player,.ball').forEach(e=>e.remove());arrows.forEach(e=>e.remove());arrows=[];ball=null}
$('arrow').onclick=()=>{arrowMode=!arrowMode;$('arrow').classList.toggle('primary',arrowMode)}
let start=null;pitch.onpointerdown=e=>{if(!arrowMode||e.target!==pitch)return;let r=pitch.getBoundingClientRect();start={x:e.clientX-r.left,y:e.clientY-r.top}};pitch.onpointerup=e=>{if(!arrowMode||!start)return;let r=pitch.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-start.x,dy=y-start.y,l=Math.hypot(dx,dy);if(l>20){let a=document.createElement('div');a.className='arrow';a.style.left=start.x+'px';a.style.top=start.y+'px';a.style.width=l+'px';a.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;pitch.appendChild(a);arrows.push(a)}start=null}
const forms={'4-4-2':[[8,50],[22,20],[22,40],[22,60],[22,80],[43,20],[43,40],[43,60],[43,80],[68,38],[68,62]],'4-3-3':[[8,50],[22,20],[22,40],[22,60],[22,80],[45,30],[45,50],[45,70],[68,25],[72,50],[68,75]],'3-5-2':[[8,50],[23,30],[23,50],[23,70],[43,15],[43,35],[43,50],[43,65],[43,85],[68,38],[68,62]]};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelector('#clear').click();forms[b.dataset.f].forEach((p,i)=>{let e=document.createElement('div');e.className='player';e.textContent=i+1;e.style.left=p[0]+'%';e.style.top=p[1]+'%';pitch.appendChild(e);dragify(e)})});
function data(){return {roster,memo:$('memo').value,board:[...pitch.querySelectorAll('.player')].map(e=>({id:e.dataset.id,x:e.style.left,y:e.style.top})),ball:ball?{x:ball.style.left,y:ball.style.top}:null}}
$('save').onclick=()=>{try{localStorage.setItem('saganBoard',JSON.stringify(data()));alert('保存しました')}catch(e){alert('保存できません。写真サイズを小さくしてください')}}
$('load').onclick=()=>{let s=localStorage.getItem('saganBoard');if(!s)return alert('保存データがありません');let d=JSON.parse(s);roster=d.roster||[];render();$('memo').value=d.memo||'';$('clear').click();(d.board||[]).forEach(p=>{if(roster.find(x=>String(x.id)===String(p.id)))place(p.id);let e=pitch.lastElementChild;e.style.left=p.x;e.style.top=p.y});if(d.ball){$('ball').click();ball.style.left=d.ball.x;ball.style.top=d.ball.y}alert('読み込みました')};render();
</script></body></html>
