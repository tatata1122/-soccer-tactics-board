<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サガン式 サッカー解説ボード</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fa;
  color:#123;
}

header{
  padding:14px 18px;
  background:#00529b;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.wrap{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:16px;
  padding:16px;
  max-width:1450px;
  margin:auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 14px #0001;
}

h2{
  margin:0 0 12px;
  font-size:20px;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin:8px 0 4px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #ccd8e2;
  border-radius:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 13px;
  background:#e8f2fb;
  color:#00529b;
  font-weight:bold;
  cursor:pointer;
}

button.primary{
  background:#00529b;
  color:#fff;
}

button.danger{
  background:#ffe8e8;
  color:#b00;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}

.hint{
  font-size:13px;
  color:#678;
  margin:8px 0;
}

.status{
  font-weight:bold;
  color:#00529b;
  margin:8px 0;
}

#players{
  max-height:420px;
  overflow:auto;
}

.p{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  border-bottom:1px solid #eee;
}

.p span{
  min-width:0;
  flex:1;
}

.thumb{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.p button{
  padding:7px 8px;
  flex-shrink:0;
}

#pitch{
  position:relative;
  width:100%;
  aspect-ratio:1.55;
  background:repeating-linear-gradient(
    0deg,
    #138b49 0 9%,
    #108044 9% 18%
  );
  border:4px solid white;
  border-radius:8px;
  overflow:hidden;
  touch-action:none;
}

.line{
  position:absolute;
  border:2px solid #fffc;
  pointer-events:none;
}

.mid{
  left:50%;
  top:0;
  height:100%;
  border-left:2px solid white;
}

.circle{
  left:50%;
  top:50%;
  width:19%;
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.boxL{
  left:0;
  top:25%;
  width:16%;
  height:50%;
}

.boxR{
  right:0;
  top:25%;
  width:16%;
  height:50%;
}

.player{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#00529b;
  color:#fff;
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  transform:translate(-50%,-50%);
  z-index:5;
  touch-action:none;
  user-select:none;
  cursor:grab;
}

.player:active{
  cursor:grabbing;
}

.player img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.playerName{
  position:absolute;
  top:61px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:white;
  color:#123;
  border-radius:6px;
  padding:2px 6px;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 1px 4px #0003;
  z-index:10;
}

.num{
  position:absolute;
  bottom:-13px;
  background:white;
  color:#00529b;
  border-radius:8px;
  padding:1px 5px;
  font-size:11px;
  z-index:11;
}

.ball{
  position:absolute;
  z-index:6;
  font-size:34px;
  transform:translate(-50%,-50%);
  touch-action:none;
  user-select:none;
  cursor:grab;
}

.arrow{
  position:absolute;
  height:4px;
  background:white;
  transform-origin:left center;
  z-index:4;
  pointer-events:none;
}

.arrow:after{
  content:"";
  position:absolute;
  right:-2px;
  top:-6px;
  border-left:13px solid white;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
}

#bench{
  margin-top:16px;
  padding:14px;
  background:#eef3f7;
  border-radius:12px;
  border:2px solid #d7e0e8;
  min-height:150px;
}

.benchTitle{
  font-weight:bold;
  color:#00529b;
  margin-bottom:10px;
}

#benchPlayers{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  min-height:90px;
}

.benchPlayer{
  width:80px;
  text-align:center;
  user-select:none;
}

.benchPlayer img,
.benchPhoto{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#00529b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-weight:bold;
}

.benchName{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.benchNum{
  font-size:11px;
  color:#00529b;
}

@media(max-width:850px){
  .wrap{
    grid-template-columns:1fr;
    padding:9px;
  }
}
</style>
</head>

<body>

<header>
⚽ サガン式 サッカー解説ボード
</header>

<div class="wrap">

<section class="card">

<h2>選手登録（最大50人）</h2>

<label>顔写真</label>
<input id="photo" type="file" accept="image/*">

<div class="row">

<div>
<label>背番号</label>
<input
  id="num"
  type="number"
  min="1"
  max="99"
  value="1">
</div>

<div>
<label>名前</label>
<input
  id="name"
  type="text"
  placeholder="選手名">
</div>

</div>

<div
  class="row"
  style="margin-top:10px">

<button
  class="primary"
  id="reg"
  type="button">
選手を登録
</button>

<button
  id="new"
  type="button">
＋新規
</button>

</div>

<div
  class="status"
  id="count">
登録選手：0 / 50人
</div>

<div id="players"></div>

<div class="hint">
一覧の「ピッチ」でピッチへ、
「ベンチ」で控え選手へ配置できます。
</div>

</section>


<section class="card">

<div class="tools">

<button
  type="button"
  data-f="4-4-2">
4-4-2
</button>

<button
  type="button"
  data-f="4-3-3">
4-3-3
</button>

<button
  type="button"
  data-f="3-5-2">
3-5-2
</button>

<button
  type="button"
  id="ball">
⚽ ボール
</button>

<button
  type="button"
  id="arrow">
↗ パス線
</button>

<button
  type="button"
  id="clear">
クリア
</button>

<button
  type="button"
  id="save"
  class="primary">
保存
</button>

<button
  type="button"
  id="load">
読み込み
</button>

</div>

<label>解説メモ</label>

<input
  id="memo"
  type="text"
  placeholder="例：右サイドから中央へ展開">

<div class="hint">
選手とボールはドラッグできます。
パス線モードではピッチをドラッグしてください。
</div>

<div id="pitch">

<div class="line mid"></div>
<div class="line circle"></div>
<div class="line boxL"></div>
<div class="line boxR"></div>

</div>


<div id="bench">

<div class="benchTitle">
🪑 ベンチ（控え選手）
<span id="benchCount">0人</span>
</div>

<div id="benchPlayers"></div>

</div>

</section>

</div>


<script>

'use strict';


/* =========================
   共通
========================= */

const $ = id => document.getElementById(id);

const pitch = $('pitch');

let roster = [];

let ball = null;

let drag = null;

let arrowMode = false;

let arrows = [];

let start = null;


/* =========================
   HTMLエスケープ
========================= */

function esc(value){

  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* =========================
   写真読み込み
========================= */

function readPhoto(file){

  return new Promise(resolve => {

    if(!file){

      resolve('');

      return;

    }

    const reader = new FileReader();

    reader.onload = () => {

      resolve(reader.result);

    };

    reader.onerror = () => {

      resolve('');

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   選手一覧表示
========================= */

function render(){

  $('count').textContent =
    `登録選手：${roster.length} / 50人`;

  $('players').innerHTML =
    roster.map(p => `

      <div class="p">

        ${
          p.photo
          ?
          `<img
            class="thumb"
            src="${p.photo}"
            alt="">`

          :

          `<div class="thumb">
            ${esc(p.num)}
          </div>`
        }

        <span>
          ${esc(p.num)}　${esc(p.name)}
        </span>

        <button
          type="button"
          class="placeBtn"
          data-id="${esc(p.id)}">
          ピッチ
        </button>

        <button
          type="button"
          class="benchBtn"
          data-id="${esc(p.id)}">
          ベンチ
        </button>

        <button
          type="button"
          class="danger delBtn"
          data-id="${esc(p.id)}">
          削除
        </button>

      </div>

    `).join('');


  document
    .querySelectorAll('.placeBtn')
    .forEach(btn => {

      btn.onclick = () => {

        place(btn.dataset.id);

      };

    });


  document
    .querySelectorAll('.benchBtn')
    .forEach(btn => {

      btn.onclick = () => {

        placeBench(btn.dataset.id);

      };

    });


  document
    .querySelectorAll('.delBtn')
    .forEach(btn => {

      btn.onclick = () => {

        const id = btn.dataset.id;

        roster = roster.filter(
          p => String(p.id) !== String(id)
        );


        pitch
          .querySelectorAll('.player')
          .forEach(e => {

            if(
              String(e.dataset.id) === String(id)
            ){

              e.remove();

            }

          });


        $('benchPlayers')
          .querySelectorAll('.benchPlayer')
          .forEach(e => {

            if(
              String(e.dataset.id) === String(id)
            ){

              e.remove();

            }

          });


        updateBenchCount();

        render();

      };

    });

}


/* =========================
   ピッチ選手作成
========================= */

function makePlayerElement(p){

  const e = document.createElement('div');

  e.className = 'player';

  e.dataset.id = p.id;


  e.innerHTML = `

    ${
      p.photo
      ?
      `<img
        src="${p.photo}"
        alt="">`

      :

      esc(p.num)
    }

    <span class="num">
      ${esc(p.num)}
    </span>

    <span class="playerName">
      ${esc(p.name)}
    </span>

  `;


  return e;

}


/* =========================
   ピッチ配置
========================= */

function place(id){

  const p =
    roster.find(
      x => String(x.id) === String(id)
    );

  if(!p){

    return;

  }


  const old =
    [...pitch.querySelectorAll('.player')]
      .find(
        e => String(e.dataset.id) === String(id)
      );


  if(old){

    old.style.left = '50%';

    old.style.top = '50%';

    return;

  }


  const e =
    makePlayerElement(p);

  e.style.left = '50%';

  e.style.top = '50%';

  pitch.appendChild(e);

  dragify(e);

}


/* =========================
   ベンチ配置
========================= */

function placeBench(id){

  const p =
    roster.find(
      x => String(x.id) === String(id)
    );

  if(!p){

    return;

  }


  const exists =
    [...$('benchPlayers')
      .querySelectorAll('.benchPlayer')]
      .some(
        e => String(e.dataset.id) === String(id)
      );


  if(exists){

    return;

  }


  const e =
    document.createElement('div');

  e.className = 'benchPlayer';

  e.dataset.id = p.id;


  if(p.photo){

    e.innerHTML = `

      <img
        src="${p.photo}"
        alt="">

      <span class="benchName">
        ${esc(p.name)}
      </span>

      <span class="benchNum">
        背番号 ${esc(p.num)}
      </span>

    `;

  }else{

    e.innerHTML = `

      <div class="benchPhoto">
        ${esc(p.num)}
      </div>

      <span class="benchName">
        ${esc(p.name)}
      </span>

      <span class="benchNum">
        背番号 ${esc(p.num)}
      </span>

    `;

  }


  $('benchPlayers')
    .appendChild(e);

  updateBenchCount();

}


/* =========================
   ベンチ人数
========================= */

function updateBenchCount(){

  const n =
    $('benchPlayers')
      .querySelectorAll('.benchPlayer')
      .length;

  $('benchCount').textContent =
    `${n}人`;

}


/* =========================
   ドラッグ
========================= */

function dragify(e){

  e.addEventListener(
    'pointerdown',
    event => {

      if(arrowMode){

        return;

      }

      event.preventDefault();

      drag = e;

      try{

        e.setPointerCapture(
          event.pointerId
        );

      }catch(err){}

    }
  );


  e.addEventListener(
    'pointermove',
    event => {

      if(drag !== e){

        return;

      }


      const r =
        pitch.getBoundingClientRect();


      const x =
        ((event.clientX - r.left) /
        r.width) * 100;


      const y =
        ((event.clientY - r.top) /
        r.height) * 100;


      e.style.left =
        Math.max(
          3,
          Math.min(97,x)
        ) + '%';


      e.style.top =
        Math.max(
          5,
          Math.min(95,y)
        ) + '%';

    }
  );


  e.addEventListener(
    'pointerup',
    () => {

      drag = null;

    }
  );


  e.addEventListener(
    'pointercancel',
    () => {

      drag = null;

    }
  );

}


/* =========================
   選手登録
========================= */

$('reg').onclick =
  async function(){

    if(roster.length >= 50){

      alert(
        '選手は最大50人です'
      );

      return;

    }


    const name =
      $('name').value.trim();


    if(!name){

      alert(
        '名前を入力してください'
      );

      $('name').focus();

      return;

    }


    const num =
      Number($('num').value);


    if(
      !Number.isInteger(num) ||
      num < 1 ||
      num > 99
    ){

      alert(
        '背番号は1〜99で入力してください'
      );

      $('num').focus();

      return;

    }


    const photo =
      await readPhoto(
        $('photo').files[0]
      );


    const p = {

      id:
        String(Date.now()) +
        String(Math.random()).slice(2),

      num:String(num),

      name:name,

      photo:photo

    };


    roster.push(p);


    render();


    $('num').value =
      Math.min(99,num + 1);


    $('name').value = '';

    $('photo').value = '';


    $('name').focus();

  };


/* =========================
   新規
========================= */

$('new').onclick =
  function(){

    $('num').value =
      Math.min(
        99,
        roster.length + 1
      );

    $('name').value = '';

    $('photo').value = '';

    $('name').focus();

  };


/* =========================
   ボール
========================= */

$('ball').onclick =
  function(){

    if(ball){

      ball.remove();

      ball = null;

      return;

    }


    ball =
      document.createElement('div');

    ball.className = 'ball';

    ball.textContent = '⚽';

    ball.style.left = '50%';

    ball.style.top = '50%';


    pitch.appendChild(ball);

    dragify(ball);

  };


/* =========================
   パス線
========================= */

$('arrow').onclick =
  function(){

    arrowMode =
      !arrowMode;


    $('arrow')
      .classList
      .toggle(
        'primary',
        arrowMode
      );


    if(!arrowMode){

      start = null;

    }

  };


pitch.addEventListener(
  'pointerdown',
  function(e){

    if(
      !arrowMode ||
      e.target !== pitch
    ){

      return;

    }


    const r =
      pitch.getBoundingClientRect();


    start = {

      x:e.clientX - r.left,

      y:e.clientY - r.top

    };

  }
);


pitch.addEventListener(
  'pointerup',
  function(e){

    if(
      !arrowMode ||
      !start
    ){

      return;

    }


    const r =
      pitch.getBoundingClientRect();


    const x =
      e.clientX - r.left;


    const y =
      e.clientY - r.top;


    const dx =
      x - start.x;


    const dy =
      y - start.y;


    const len =
      Math.hypot(dx,dy);


    if(len > 20){

      const a =
        document.createElement('div');


      a.className = 'arrow';


      a.style.left =
        start.x + 'px';


      a.style.top =
        start.y + 'px';


      a.style.width =
        len + 'px';


      a.style.transform =
        `rotate(${Math.atan2(dy,dx)}rad)`;


      pitch.appendChild(a);


      arrows.push(a);

    }


    start = null;

  }
);


/* =========================
   クリア
========================= */

$('clear').onclick =
  function(){

    pitch
      .querySelectorAll(
        '.player,.ball,.arrow'
      )
      .forEach(
        e => e.remove()
      );


    arrows = [];

    ball = null;

    start = null;

  };


/* =========================
   フォーメーション
========================= */

const forms = {

  '4-4-2': [

    [8,50],

    [22,20],
    [22,40],
    [22,60],
    [22,80],

    [43,20],
    [43,40],
    [43,60],
    [43,80],

    [68,38],
    [68,62]

  ],


  '4-3-3': [

    [8,50],

    [22,20],
    [22,40],
    [22,60],
    [22,80],

    [45,30],
    [45,50],
    [45,70],

    [68,25],
    [72,50],
    [68,75]

  ],


  '3-5-2': [

    [8,50],

    [23,30],
    [23,50],
    [23,70],

    [43,15],
    [43,35],
    [43,50],
    [43,65],
    [43,85],

    [68,38],
    [68,62]

  ]

};


document
  .querySelectorAll('[data-f]')
  .forEach(btn => {

    btn.onclick =
      function(){

        const positions =
          forms[
            btn.dataset.f
          ];


        pitch
          .querySelectorAll('.player')
          .forEach(
            e => e.remove()
          );


        roster
          .slice(0,11)
          .forEach(
            (p,i) => {

              const pos =
                positions[i];


              if(!pos){

                return;

              }


              const e =
                makePlayerElement(p);


              e.style.left =
                pos[0] + '%';


              e.style.top =
                pos[1] + '%';


              pitch.appendChild(e);

              dragify(e);

            }
          );

      };

  });


/* =========================
   保存
========================= */

$('save').onclick =
  function(){

    try{

      const board =
        [...pitch.querySelectorAll('.player')]
          .map(e => ({

            id:e.dataset.id,

            x:e.style.left,

            y:e.style.top

          }));


      const bench =
        [...$('benchPlayers')
          .querySelectorAll('.benchPlayer')]
          .map(
            e => e.dataset.id
          );


      const arrowData =
        [...pitch.querySelectorAll('.arrow')]
          .map(e => ({

            left:e.style.left,

            top:e.style.top,

            width:e.style.width,

            transform:e.style.transform

          }));


      const data = {

        roster:roster,

        memo:$('memo').value,

        board:board,

        bench:bench,

        arrows:arrowData,

        ball:
          ball
          ?
          {
            x:ball.style.left,
            y:ball.style.top
          }
          :
          null

      };


      localStorage.setItem(
        'saganBoard',
        JSON.stringify(data)
      );


      alert(
        '保存しました！'
      );


    }catch(e){

      console.error(e);

      alert(
        '保存できません。写真サイズを小さくしてください。'
      );

    }

  };


/* =========================
   読み込み
========================= */

$('load').onclick =
  function(){

    try{

      const s =
        localStorage.getItem(
          'saganBoard'
        );


      if(!s){

        alert(
          '保存データがありません'
        );

        return;

      }


      const d =
        JSON.parse(s);


      roster =
        Array.isArray(d.roster)
        ?
        d.roster
        :
        [];


      $('memo').value =
        d.memo || '';


      render();


      pitch
        .querySelectorAll(
          '.player,.ball,.arrow'
        )
        .forEach(
          e => e.remove()
        );


      $('benchPlayers')
        .innerHTML = '';


      arrows = [];

      ball = null;


      (d.board || [])
        .forEach(p => {

          if(
            !roster.some(
              x =>
                String(x.id) ===
                String(p.id)
            )
          ){

            return;

          }


          place(p.id);


          const e =
            [...pitch
              .querySelectorAll('.player')]
              .find(
                x =>
                  String(x.dataset.id) ===
                  String(p.id)
              );


          if(e){

            e.style.left =
              p.x || '50%';

            e.style.top =
              p.y || '50%';

          }

        });


      (d.bench || [])
        .forEach(id => {

          if(
            roster.some(
              x =>
                String(x.id) ===
                String(id)
            )
          ){

            placeBench(id);

          }

        });


      (d.arrows || [])
        .forEach(a => {

          const e =
            document.createElement('div');


          e.className =
            'arrow';


          e.style.left =
            a.left || '0px';


          e.style.top =
            a.top || '0px';


          e.style.width =
            a.width || '0px';


          e.style.transform =
            a.transform || 'none';


          pitch.appendChild(e);


          arrows.push(e);

        });


      if(d.ball){

        ball =
          document.createElement('div');


        ball.className =
          'ball';


        ball.textContent =
          '⚽';


        ball.style.left =
          d.ball.x || '50%';


        ball.style.top =
          d.ball.y || '50%';


        pitch.appendChild(ball);


        dragify(ball);

      }


      updateBenchCount();


      alert(
        '読み込みました！'
      );


    }catch(e){

      console.error(e);

      alert(
        '読み込みに失敗しました。'
      );

    }

  };


/* =========================
   初期表示
========================= */

render();

updateBenchCount();

</script>

</body>
</html>
